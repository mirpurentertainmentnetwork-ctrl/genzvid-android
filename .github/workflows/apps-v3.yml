name: Build GEN Z VID v3 Supabase apps
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/apps-v3.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
    - name: Check signing password
      shell: bash
      run: |
        set -euo pipefail
        if [ "${#KEYSTORE_PASSWORD}" -lt 16 ] || [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Add ANDROID_KEYSTORE_PASSWORD (at least 16 characters) and ANDROID_KEYSTORE_BASE64 as repository Actions secrets."
          exit 1
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configure preinstalled Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
        test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        # Use a finite input file so pipefail cannot turn yes/SIGPIPE into a failure.
        printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers.txt"
        "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses \
          < "$RUNNER_TEMP/android-license-answers.txt" > "$RUNNER_TEMP/android-licenses.log" 2>&1 || {
            tail -n 40 "$RUNNER_TEMP/android-licenses.log"
            exit 1
          }
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.2
    - name: Install Android SDK and Cordova
      run: |
        set -euo pipefail
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        npm install --global cordova@13.0.0
    - name: Create Firebase WebView project
      shell: bash
      run: |
        set -euo pipefail
        cordova create genzvid com.pmbsiam.genzvid "GEN Z VID"
        cd genzvid
        cat > config.xml <<'XML'
        <?xml version="1.0" encoding="UTF-8"?>
        <widget id="com.pmbsiam.genzvid" version="1.0.2" android-versionCode="3"
            xmlns="http://www.w3.org/ns/widgets"
            xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>GEN Z VID</name>
            <description>Social media platform maker by PMB SIAM</description>
            <author email="developer@pmbsiam.com" href="https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site">PMB SIAM</author>
            <content src="https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site" />
            <access origin="*" />
            <allow-navigation href="https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site/*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="LogLevel" value="ERROR" />
            <preference name="AndroidWindowSplashScreenBackground" value="#38176F" />
            <preference name="android-versionCode" value="3" />
        </widget>
        XML
        cordova platform add android@15.1.0
    - name: Restore release keystore from Secrets
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -p signing
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/genzvid-release.keystore
        keytool -list -keystore signing/genzvid-release.keystore \
          -storepass:env KEYSTORE_PASSWORD -alias genzvid_alias > /dev/null
    - name: Configure release signing
      shell: bash
      run: |
        set -euo pipefail
        node <<'JS'
        const fs = require('fs');
        const path = require('path');
        const password = process.env.KEYSTORE_PASSWORD;
        fs.writeFileSync('genzvid/build.json', JSON.stringify({
          android: { release: {
            keystore: path.resolve('signing/genzvid-release.keystore'),
            storePassword: password,
            alias: 'genzvid_alias',
            password: password,
            keystoreType: 'jks'
          }}
        }), { mode: 0o600 });
        JS
    - name: Install animated gradient splash and tested browser-tab login
      shell: bash
      run: |
        set -euo pipefail
        cat > genzvid/platforms/android/app/src/main/java/com/pmbsiam/genzvid/MainActivity.java <<'JAVA'
        package com.pmbsiam.genzvid;

        import org.apache.cordova.CordovaActivity;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.content.Intent;
        import android.net.Uri;
        import android.graphics.*;
        import android.view.View;
        import android.animation.ValueAnimator;
        import android.view.animation.OvershootInterpolator;
        import android.widget.Toast;
        import android.content.ComponentName;
        import androidx.browser.customtabs.CustomTabsClient;
        import androidx.browser.customtabs.CustomTabsCallback;
        import androidx.browser.customtabs.CustomTabsServiceConnection;
        import androidx.browser.customtabs.CustomTabsSession;
        import androidx.browser.customtabs.CustomTabsIntent;
        import androidx.browser.trusted.TrustedWebActivityIntentBuilder;
        import java.util.Arrays;

        public class MainActivity extends CordovaActivity {
            private final Handler handler = new Handler(Looper.getMainLooper());
            private SplashView splash;
            private CustomTabsSession browserSession;
            private boolean bound;
            private int launchAttempts;
            private final CustomTabsServiceConnection browserConnection = new CustomTabsServiceConnection() {
                @Override public void onCustomTabsServiceConnected(ComponentName name, CustomTabsClient client) {
                    client.warmup(0L);
                    browserSession = client.newSession(new CustomTabsCallback());
                }
                @Override public void onServiceDisconnected(ComponentName name) { browserSession = null; }
            };
            private boolean opened = false;
            private final Runnable launch = () -> openSite();
            @Override public void onCreate(Bundle state) {
                super.onCreate(state);
                getWindow().setStatusBarColor(Color.rgb(31, 15, 71));
                getWindow().setNavigationBarColor(Color.rgb(18, 16, 49));
                String provider = CustomTabsClient.getPackageName(this, Arrays.asList("com.android.chrome", "com.microsoft.emmx", "com.brave.browser"));
                if (provider != null) bound = CustomTabsClient.bindCustomTabsService(this, provider, browserConnection);
                splash = new SplashView();
                setContentView(splash);
                if (state == null) handler.postDelayed(launch, 1700);
                else opened = true;
                splash.setOnClickListener(v -> openSite());
            }
            private void openSite() {
                if (isFinishing()) return;
                handler.removeCallbacks(launch);
                try {
                    Uri uri = Uri.parse("https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site");
                    if (bound && browserSession == null && launchAttempts++ < 5) {
                        handler.postDelayed(launch, 200);
                        return;
                    }
                    if (browserSession != null) {
                        new TrustedWebActivityIntentBuilder(uri).build(browserSession).launchTrustedWebActivity(this);
                    } else {
                        new CustomTabsIntent.Builder().setShowTitle(false).setUrlBarHidingEnabled(true).build().launchUrl(this, uri);
                    }
                    opened = true;
                    splash.stop();
                } catch (android.content.ActivityNotFoundException e) {
                    Toast.makeText(this, "Enable a web browser, then tap to retry.", Toast.LENGTH_LONG).show();
                }
            }
            @Override protected void onResume() {
                super.onResume();
                // Returning from the browser shows the branded screen without opening another tab.
                if (opened && splash != null) splash.finishAnimation();
            }
            @Override public void onDestroy() {
                handler.removeCallbacks(launch);
                if (splash != null) splash.stop();
                if (bound) { unbindService(browserConnection); bound = false; }
                super.onDestroy();
            }
            private class SplashView extends View {
                private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                private final ValueAnimator animator;
                private float progress = 0f;
                SplashView() {
                    super(MainActivity.this);
                    setContentDescription("GEN Z VID. Create, watch and connect. Tap to open.");
                    animator = ValueAnimator.ofFloat(0f, 1f);
                    animator.setDuration(1450);
                    animator.addUpdateListener(a -> { progress = (float)a.getAnimatedValue(); invalidate(); });
                    animator.start();
                }
                void stop() { animator.cancel(); }
                void finishAnimation() { animator.cancel(); progress = 1f; invalidate(); }
                private void text(Canvas c, String text, float y, float size, int color, int alpha) {
                    paint.setShader(null); paint.setColor(color); paint.setAlpha(alpha);
                    paint.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                    paint.setTextAlign(Paint.Align.CENTER); paint.setTextSize(size);
                    c.drawText(text, 200, y, paint); paint.setAlpha(255);
                }
                @Override protected void onDraw(Canvas original) {
                    super.onDraw(original);
                    float w=getWidth(), h=getHeight();
                    paint.setShader(new LinearGradient(0,0,w,h,new int[]{0xFF38176F,0xFF761D91,0xFF214F9C,0xFF102B4F},null,Shader.TileMode.CLAMP));
                    original.drawRect(0,0,w,h,paint); paint.setShader(null);
                    float scale=Math.min(w/400f,h/720f);
                    original.save(); original.translate((w-400*scale)/2,(h-720*scale)/2); original.scale(scale,scale);
                    Canvas c=original;
                    paint.setColor(0x26FF6BA9);c.drawCircle(355,120,135,paint);
                    paint.setColor(0x2226E6EF);c.drawCircle(20,565,155,paint);
                    paint.setColor(0x18FFFFFF);c.drawCircle(38,128,5,paint);c.drawCircle(340,515,6,paint);c.drawCircle(310,230,3,paint);
                    float p=Math.min(1f,progress/0.65f);
                    float pop=new OvershootInterpolator(1.1f).getInterpolation(p);
                    c.save();c.scale(0.66f+0.34f*pop,0.66f+0.34f*pop,200,283);
                    paint.setShader(new LinearGradient(133,215,267,349,new int[]{0xFFFFD76E,0xFFFF8A70,0xFFFF4D9A},null,Shader.TileMode.CLAMP));
                    c.drawRoundRect(133,215,267,349,37,37,paint);paint.setShader(null);
                    paint.setColor(Color.WHITE);Path play=new Path();play.moveTo(184,248);play.lineTo(184,316);play.lineTo(235,282);play.close();c.drawPath(play,paint);
                    c.restore();
                    float title=Math.max(0f,Math.min(1f,(progress-0.12f)/0.52f));
                    float bounce=new OvershootInterpolator(0.8f).getInterpolation(title);
                    c.save();c.scale(0.82f+0.18f*bounce,0.82f+0.18f*bounce,200,421);
                    text(c,"GEN Z",414+(1-title)*22,54,Color.WHITE,(int)(255*title));
                    paint.setShader(new LinearGradient(125,435,275,480,new int[]{0xFFFFDD78,0xFFFF8CAC},null,Shader.TileMode.CLAMP));
                    paint.setTextSize(58);paint.setTextAlign(Paint.Align.CENTER);paint.setTypeface(Typeface.create("sans-serif",Typeface.BOLD));paint.setAlpha((int)(255*title));c.drawText("VID",200,477+(1-title)*16,paint);paint.setShader(null);paint.setAlpha(255);c.restore();
                    float sub=Math.max(0f,Math.min(1f,(progress-0.45f)/0.5f));
                    text(c,"CREATE  /  WATCH  /  CONNECT",522,12,0xFFE1DFF8,(int)(255*sub));
                    for(int i=0;i<3;i++){paint.setColor(i==((int)(progress*8)%3)?0xFFFFD76E:0x667FFFFF);paint.setAlpha((int)(220*sub));c.drawCircle(184+i*16,569,3.5f,paint);}paint.setAlpha(255);
                    text(c,"YOUR WORLD. YOUR VOICE.",662,10,0xFFC8C5E7,(int)(210*sub));
                    original.restore();
                }
            }
        }
        JAVA
    - name: Configure verified Trusted Web Activity with AndroidX Browser
      shell: bash
      run: |
        set -euo pipefail
        cat > genzvid/platforms/android/app/build-extras.gradle <<'GRADLE'
        dependencies { implementation 'androidx.browser:browser:1.8.0' }
        GRADLE
        python3 <<'MANIFEST'
        from pathlib import Path
        import xml.etree.ElementTree as E,json
        base=Path('genzvid/platforms/android/app/src/main')
        ns='http://schemas.android.com/apk/res/android';E.register_namespace('android',ns)
        p=base/'AndroidManifest.xml';tree=E.parse(p);root=tree.getroot();app=root.find('application')
        E.SubElement(app,'meta-data',{f'{{{ns}}}name':'asset_statements',f'{{{ns}}}resource':'@string/asset_statements'})
        queries=root.find('queries')
        if queries is None:queries=E.SubElement(root,'queries')
        intent=E.SubElement(queries,'intent');E.SubElement(intent,'action',{f'{{{ns}}}name':'android.support.customtabs.action.CustomTabsService'})
        for pkg in ['com.android.chrome','com.microsoft.emmx','com.brave.browser']:E.SubElement(queries,'package',{f'{{{ns}}}name':pkg})
        tree.write(p,encoding='utf-8',xml_declaration=True)
        resources=E.Element('resources');value=E.SubElement(resources,'string',{'name':'asset_statements','translatable':'false'})
        value.text=json.dumps([{'relation':['delegate_permission/common.handle_all_urls'],'target':{'namespace':'web','site':'https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site'}}]).replace(chr(34),chr(92)+chr(34))
        E.ElementTree(resources).write(base/'res/values/asset_statements.xml',encoding='utf-8',xml_declaration=True)
        MANIFEST
    - name: Build signed release bundle
      shell: bash
      run: |
        set -euo pipefail
        cd genzvid
        cordova build android --release --buildConfig=build.json -- --packageType=bundle
        cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../app-release-v3.aab
    - name: Verify bundle signature
      shell: bash
      run: |
        set -euo pipefail
        jarsigner -verify app-release-v3.aab > signature-check.txt
        grep -q "jar verified" signature-check.txt
    - name: Upload signed Android bundle
      uses: actions/upload-artifact@v4
      with:
        name: GEN_Z_VID-v3-aab
        path: app-release-v3.aab
        retention-days: 30
        if-no-files-found: error
    - name: Build signed Android APK
      shell: bash
      run: |
        set -euo pipefail
        cd genzvid
        cordova build android --release --buildConfig=build.json -- --packageType=apk
        cp platforms/android/app/build/outputs/apk/release/app-release.apk ../app-release-v3.apk
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../app-release-v3.apk
    - name: Verify exact v3 versionCode 3 and versionName 1.0.2
      shell: bash
      run: |
        set -euo pipefail
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app-release-v3.apk > version-info.txt
        head -n 1 version-info.txt
        grep -q "name='com.pmbsiam.genzvid'" version-info.txt
        grep -q "versionCode='3'" version-info.txt
        grep -q "versionName='1.0.2'" version-info.txt
    - name: Upload signed Android APK
      uses: actions/upload-artifact@v4
      with:
        name: GEN_Z_VID-v3-apk
        path: app-release-v3.apk
        retention-days: 30
        if-no-files-found: error
    - name: Remove temporary signing credentials
      if: always()
      run: rm -f genzvid/build.json signing/genzvid-release.keystore signing/ANDROID_KEYSTORE_BASE64.txt
    name: Android v3 signed AAB and APK
    needs:
    - callback-check
  windows:
    name: Windows v3 in-app EXE
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Create Windows app source
      shell: bash
      run: |
        set -euo pipefail
        mkdir desktop
        cd desktop
        cat > package.json <<'JSON'
        {
          "name": "genzvid-desktop",
          "version": "1.0.2",
          "description": "GEN Z VID desktop app",
          "author": "PMB SIAM",
          "main": "main.js",
          "private": true,
          "devDependencies": {
            "electron": "44.7.2",
            "electron-builder": "26.15.3"
          },
          "build": {
            "appId": "com.pmbsiam.genzvid.desktop",
            "productName": "GEN Z VID",
            "files": [
              "main.js",
              "preload.js",
              "package.json"
            ],
            "asar": true,
            "win": {
              "target": [
                {
                  "target": "portable",
                  "arch": [
                    "x64"
                  ]
                }
              ],
              "signAndEditExecutable": true,
              "signExecutable": false,
              "icon": "build/icon.ico"
            },
            "artifactName": "GEN_Z_VID-Windows-v3-${arch}.${ext}",
            "nsis": {
              "artifactName": "GEN_Z_VID-Setup-${arch}.${ext}",
              "oneClick": false,
              "allowToChangeInstallationDirectory": true
            },
            "msi": {
              "artifactName": "GEN_Z_VID-Installer-${arch}.${ext}"
            }
          }
        }
        JSON
        cat > main.js <<'JS'
        const {app,BrowserWindow,shell,ipcMain,dialog}=require('electron');
        const path=require('path'),http=require('http'),crypto=require('crypto');
        const SITE='https://gen-z-vid-supabase.mirpurentertainmentn.chatgpt.site';
        let mainWindow,pending=false;
        function isSite(url){try{return new URL(url).origin===SITE}catch{return false}}
        ipcMain.handle('genzvid:sign-in',async event=>{
         if(event.sender!==mainWindow?.webContents||!isSite(event.senderFrame?.url))throw Error('Untrusted login request');
         if(pending)throw Error('A sign-in window is already open');pending=true;
         try{return await new Promise((resolve,reject)=>{
          const state=crypto.randomBytes(32).toString('hex');let timer,port,done=false;
          const complete=(error,session)=>{if(done)return;done=true;clearTimeout(timer);server.close();if(error)reject(error);else{mainWindow?.show();mainWindow?.focus();resolve(session)}};
          const server=http.createServer((req,res)=>{
           res.setHeader('Cache-Control','no-store');res.setHeader('Referrer-Policy','no-referrer');res.setHeader('X-Content-Type-Options','nosniff');
           if(req.method==='GET'&&req.url==='/callback'){
            const nonce=crypto.randomBytes(16).toString('hex');res.setHeader('Content-Type','text/html; charset=utf-8');res.setHeader('Content-Security-Policy',`default-src 'none'; script-src 'nonce-${nonce}'; connect-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'`);
            res.end(`<!doctype html><meta charset="utf-8"><title>GEN Z VID</title><body style="font:20px system-ui;background:#201441;color:white;padding:12vh 10vw"><h1>GEN Z VID</h1><p id="message">Finishing sign-in…</p><script nonce="${nonce}">const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'','/callback');fetch('/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(p))}).then(r=>{if(!r.ok)throw Error();document.getElementById('message').textContent='Signed in. Return to the GEN Z VID app. You can close this tab.'}).catch(()=>document.getElementById('message').textContent='Sign-in did not complete. Please retry from the app.');</script>`);return;
           }
           if(req.method==='POST'&&req.url==='/session'&&req.headers.origin===`http://127.0.0.1:${port}`){
            let body='';req.on('data',chunk=>{body+=chunk;if(body.length>20000)req.destroy()});
            req.on('end',()=>{try{const data=JSON.parse(body);if(data.state!==state||typeof data.access_token!=='string'||typeof data.refresh_token!=='string')throw Error();res.writeHead(200);res.end('OK');complete(null,{access_token:data.access_token,refresh_token:data.refresh_token})}catch{res.writeHead(400);res.end('Invalid sign-in response')}});return;
           }
           res.writeHead(404);res.end();
          });
          server.on('error',error=>complete(error));server.listen(0,'127.0.0.1',()=>{port=server.address().port;timer=setTimeout(()=>complete(Error('Sign-in timed out. Please retry.')),180000);shell.openExternal(`${SITE}/desktop-auth.html?port=${port}&state=${state}`).catch(error=>complete(error))});
         })}finally{pending=false}
        });
        app.whenReady().then(()=>{
         mainWindow=new BrowserWindow({width:1280,height:840,minWidth:400,minHeight:600,title:'GEN Z VID',autoHideMenuBar:true,backgroundColor:'#211545',webPreferences:{preload:path.join(__dirname,'preload.js'),nodeIntegration:false,contextIsolation:true,sandbox:true}});
         mainWindow.webContents.on('will-navigate',(event,url)=>{if(!isSite(url)){event.preventDefault();try{if(new URL(url).protocol==='https:')shell.openExternal(url).catch(()=>{})}catch{}}});
         mainWindow.webContents.setWindowOpenHandler(({url})=>{try{if(new URL(url).protocol==='https:')shell.openExternal(url).catch(()=>{})}catch{}return {action:'deny'}});
         mainWindow.webContents.session.setPermissionRequestHandler(async(contents,permission,respond)=>{
          if(contents!==mainWindow.webContents||!isSite(contents.getURL()))return respond(false);
          if(permission==='fullscreen'||permission==='clipboard-sanitized-write')return respond(true);
          if(permission==='media'||permission==='notifications'){const result=await dialog.showMessageBox(mainWindow,{type:'question',buttons:['Deny','Allow'],defaultId:0,cancelId:0,title:'GEN Z VID permission',message:`Allow this app to use ${permission==='media'?'your camera or microphone':'notifications'}?`});return respond(result.response===1)}respond(false);
         });
         mainWindow.loadURL(SITE).catch(()=>dialog.showErrorBox('GEN Z VID','Unable to load the website. Check your internet connection.'));
        });
        app.on('window-all-closed',()=>app.quit());
        JS
        cat > preload.js <<'JS'
        const {contextBridge,ipcRenderer}=require('electron');
        contextBridge.exposeInMainWorld('genzvidDesktop',{signIn:()=>ipcRenderer.invoke('genzvid:sign-in')});
        JS
        node --check main.js
        node --check preload.js
    - name: Install Windows build dependencies
      working-directory: desktop
      shell: bash
      run: npm install --no-audit --no-fund
    - name: Provide valid installer icon
      working-directory: desktop
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build
        node <<'ICON'
        const fs = require('fs');
        const icon = Buffer.from('', 'base64');
        if (icon.readUInt16LE(2) !== 1) throw new Error('Invalid icon');
        fs.writeFileSync('build/icon.ico', icon);
        ICON
    - name: Build Windows v3 portable EXE
      working-directory: desktop
      shell: bash
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: |
        set -euo pipefail
        npx electron-builder --win "portable" --x64 --publish never
    - name: Verify package exists
      shell: pwsh
      env:
        PACKAGE_FILE: GEN_Z_VID-Windows-v3-x64.exe
      run: |
        $file = Get-Item (Join-Path "desktop/dist" $env:PACKAGE_FILE)
        if ($file.Length -lt 1MB) { throw "Windows package is unexpectedly small." }
    - name: Upload Windows v3 EXE
      uses: actions/upload-artifact@v4
      with:
        name: GEN_Z_VID-v3-Windows
        path: desktop/dist/GEN_Z_VID-Windows-v3-x64.exe
        retention-days: 30
        if-no-files-found: error
    needs:
    - callback-check
  publish:
    name: Replace corrected v3 and remove superseded release downloads
    needs:
    - android
    - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: GEN_Z_VID-v3-*
        merge-multiple: true
        path: packages
    - name: Publish fixed v3 packages and remove earlier app binaries
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        test -s packages/app-release-v3.aab
        test -s packages/app-release-v3.apk
        test -s packages/GEN_Z_VID-Windows-v3-x64.exe
        gh release upload windows-38776200946 packages/app-release-v3.aab packages/app-release-v3.apk packages/GEN_Z_VID-Windows-v3-x64.exe --clobber
