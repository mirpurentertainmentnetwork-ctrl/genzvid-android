name: Build Android and Windows apps
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-release.yml
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
    - name: Check signing password
      shell: bash
      run: |
        set -euo pipefail
        if [ "${#KEYSTORE_PASSWORD}" -lt 16 ] || [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Add ANDROID_KEYSTORE_PASSWORD (at least 16 characters) and ANDROID_KEYSTORE_BASE64 as repository Actions secrets."
          exit 1
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configure preinstalled Android SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
        test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        # Use a finite input file so pipefail cannot turn yes/SIGPIPE into a failure.
        printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers.txt"
        "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses \
          < "$RUNNER_TEMP/android-license-answers.txt" > "$RUNNER_TEMP/android-licenses.log" 2>&1 || {
            tail -n 40 "$RUNNER_TEMP/android-licenses.log"
            exit 1
          }
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.2
    - name: Install Android SDK and Cordova
      run: |
        set -euo pipefail
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        npm install --global cordova@13.0.0
    - name: Create Firebase WebView project
      shell: bash
      run: |
        set -euo pipefail
        cordova create genzvid com.pmbsiam.genzvid "GEN Z VID"
        cd genzvid
        cat > config.xml <<'XML'
        <?xml version="1.0" encoding="UTF-8"?>
        <widget id="com.pmbsiam.genzvid" version="1.0.1"
            xmlns="http://www.w3.org/ns/widgets"
            xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>GEN Z VID</name>
            <description>Social media platform maker by PMB SIAM</description>
            <author email="developer@pmbsiam.com" href="https://gen-z-vid.firebaseapp.com">PMB SIAM</author>
            <content src="https://gen-z-vid.firebaseapp.com" />
            <access origin="*" />
            <allow-navigation href="https://gen-z-vid.firebaseapp.com/*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="LogLevel" value="ERROR" />
            <preference name="android-versionCode" value="100000000" />
        </widget>
        XML
        node <<'VERSION'
        const fs = require('fs');
        const code = String(100000000 + Number(process.env.GITHUB_RUN_NUMBER));
        const xml = fs.readFileSync('config.xml', 'utf8').replace('value="100000000"', 'value="' + code + '"');
        fs.writeFileSync('config.xml', xml);
        VERSION
        cordova platform add android@15.1.0
    - name: Restore release keystore from Secrets
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -p signing
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/genzvid-release.keystore
        keytool -list -keystore signing/genzvid-release.keystore \
          -storepass:env KEYSTORE_PASSWORD -alias genzvid_alias > /dev/null
    - name: Configure release signing
      shell: bash
      run: |
        set -euo pipefail
        node <<'JS'
        const fs = require('fs');
        const path = require('path');
        const password = process.env.KEYSTORE_PASSWORD;
        fs.writeFileSync('genzvid/build.json', JSON.stringify({
          android: { release: {
            keystore: path.resolve('signing/genzvid-release.keystore'),
            storePassword: password,
            alias: 'genzvid_alias',
            password: password,
            keystoreType: 'jks'
          }}
        }), { mode: 0o600 });
        JS
    - name: Use browser session for website and Google login
      shell: bash
      run: "set -euo pipefail\ncat > genzvid/platforms/android/app/src/main/java/com/pmbsiam/genzvid/MainActivity.java <<'JAVA'\n\
        package com.pmbsiam.genzvid;\n\nimport org.apache.cordova.CordovaActivity;\nimport android.os.Bundle;\nimport android.content.Intent;\n\
        import android.net.Uri;\nimport android.widget.TextView;\nimport android.widget.Button;\nimport android.widget.LinearLayout;\n\
        import android.widget.Toast;\n\npublic class MainActivity extends CordovaActivity {\n    @Override public void onCreate(Bundle\
        \ state) {\n        super.onCreate(state);\n        LinearLayout layout = new LinearLayout(this);\n        layout.setOrientation(LinearLayout.VERTICAL);\n\
        \        layout.setPadding(32, 64, 32, 32);\n        TextView title = new TextView(this);\n        title.setText(\"\
        GEN Z VID\");\n        title.setTextSize(28);\n        layout.addView(title);\n        TextView info = new TextView(this);\n\
        \        info.setText(\"Opening GEN Z VID\u2026\");\n        layout.addView(info);\n        Button open = new Button(this);\n\
        \        open.setText(\"Open GEN Z VID\");\n        open.setOnClickListener(v -> openSite());\n        open.setVisibility(android.view.View.GONE);\n\
        \        layout.addView(open);\n        setContentView(layout);\n        openSite();\n    }\n    private void openSite()\
        \ {\n        try {\n            Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://gen-z-vid.firebaseapp.com\"\
        ));\n            // Custom Tabs protocol: a null session lets compatible browsers open a browser tab.\n          \
        \  Bundle extras = new Bundle();\n            extras.putBinder(\"android.support.customtabs.extra.SESSION\", null);\n\
        \            intent.putExtras(extras);\n            intent.putExtra(\"android.support.customtabs.extra.TITLE_VISIBILITY\"\
        , 0);\n            intent.putExtra(\"android.support.customtabs.extra.ENABLE_URLBAR_HIDING\", true);\n           \
        \ startActivity(intent);\n        } catch (android.content.ActivityNotFoundException e) {\n            Toast.makeText(this,\
        \ \"Install or enable a web browser to open GEN Z VID.\", Toast.LENGTH_LONG).show();\n        }\n    }\n}\nJAVA\n"
    - name: Build signed release bundle
      shell: bash
      run: |
        set -euo pipefail
        cd genzvid
        cordova build android --release --buildConfig=build.json -- --packageType=bundle
        cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../GEN_Z_VID.aab
      if: matrix.package == 'aab'
    - name: Verify bundle signature
      shell: bash
      run: |
        set -euo pipefail
        jarsigner -verify GEN_Z_VID.aab > signature-check.txt
        grep -q "jar verified" signature-check.txt
      if: matrix.package == 'aab'
    - name: Upload signed Android bundle
      uses: actions/upload-artifact@v4
      with:
        name: GEN_Z_VID-signed-aab
        path: GEN_Z_VID.aab
        retention-days: 30
        if-no-files-found: error
      if: matrix.package == 'aab'
    - name: Build signed Android APK
      shell: bash
      run: |
        set -euo pipefail
        cd genzvid
        cordova build android --release --buildConfig=build.json -- --packageType=apk
        cp platforms/android/app/build/outputs/apk/release/app-release.apk ../GEN_Z_VID.apk
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../GEN_Z_VID.apk
      if: matrix.package == 'apk'
    - name: Upload signed Android APK
      uses: actions/upload-artifact@v4
      with:
        name: GEN_Z_VID-signed-apk
        path: GEN_Z_VID.apk
        retention-days: 30
        if-no-files-found: error
      if: matrix.package == 'apk'
    - name: Remove temporary signing credentials
      if: always()
      run: rm -f genzvid/build.json signing/genzvid-release.keystore signing/ANDROID_KEYSTORE_BASE64.txt
    name: Android ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package:
        - aab
        - apk
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Create Windows app source
      shell: bash
      run: |
        set -euo pipefail
        mkdir desktop
        cd desktop
        cat > package.json <<'JSON'
        {
          "name": "genzvid-desktop",
          "version": "1.0.0",
          "description": "GEN Z VID desktop app",
          "author": "PMB SIAM",
          "main": "main.js",
          "private": true,
          "devDependencies": {
            "electron": "44.7.2",
            "electron-builder": "26.15.3"
          },
          "build": {
            "appId": "com.pmbsiam.genzvid.desktop",
            "productName": "GEN Z VID",
            "files": [
              "main.js",
              "package.json"
            ],
            "asar": true,
            "win": {
              "target": [
                {
                  "target": "portable",
                  "arch": [
                    "x64"
                  ]
                },
                {
                  "target": "nsis",
                  "arch": [
                    "x64"
                  ]
                },
                {
                  "target": "msi",
                  "arch": [
                    "x64"
                  ]
                }
              ],
              "signAndEditExecutable": true,
              "signExecutable": false,
              "icon": "build/icon.ico"
            },
            "artifactName": "GEN_Z_VID-Windows-${arch}.${ext}",
            "nsis": {
              "artifactName": "GEN_Z_VID-Setup-${arch}.${ext}",
              "oneClick": false,
              "allowToChangeInstallationDirectory": true
            },
            "msi": {
              "artifactName": "GEN_Z_VID-Installer-${arch}.${ext}"
            }
          }
        }
        JSON
        cat > main.js <<'JS'
        const { app, BrowserWindow, shell, dialog } = require('electron');
        const HOME = 'https://gen-z-vid.firebaseapp.com';
        let mainWindow;
        function openSite() {
          shell.openExternal(HOME).catch(() => {
            dialog.showErrorBox('GEN Z VID', 'Could not open your browser. Enable a default web browser and try again.');
          });
        }
        app.whenReady().then(() => {
          mainWindow = new BrowserWindow({
            width: 520, height: 330, title: 'GEN Z VID', autoHideMenuBar: true,
            webPreferences: { nodeIntegration: false, contextIsolation: true, sandbox: true }
          });
          mainWindow.webContents.on('will-navigate', (event, url) => {
            event.preventDefault();
            if (url === HOME || url === HOME + '/') openSite();
          });
          mainWindow.webContents.setWindowOpenHandler(() => ({ action: 'deny' }));
          const html = '<!doctype html><html><head><meta charset="utf-8"><title>GEN Z VID</title></head><body style="font-family:Segoe UI,sans-serif;padding:32px;background:#101827;color:white"><h1>GEN Z VID</h1><p>Your browser opens the app and keeps your Google login session.</p><a style="display:inline-block;padding:12px 20px;background:#ffce64;color:#141414;border-radius:8px;text-decoration:none" href="' + HOME + '">Open GEN Z VID</a></body></html>';
          mainWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(html));
          openSite();
        });
        app.on('window-all-closed', () => app.quit());
        JS
        node --check main.js
    - name: Install Windows build dependencies
      working-directory: desktop
      shell: bash
      run: npm install --no-audit --no-fund
    - name: Provide valid installer icon
      working-directory: desktop
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Drawing
        New-Item -ItemType Directory -Force build | Out-Null
        $source = (Resolve-Path "node_modules/electron/dist/electron.exe").Path
        $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($source)
        if ($null -eq $icon) { throw "Could not extract a valid application icon." }
        $stream = [System.IO.File]::Create((Join-Path $PWD "build/icon.ico"))
        try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }
        if ((Get-Item build/icon.ico).Length -lt 20) { throw "Application icon is invalid." }
    - name: Build ${{ matrix.label }}
      working-directory: desktop
      shell: bash
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: |
        set -euo pipefail
        npx electron-builder --win "${{ matrix.target }}" --x64 --publish never
    - name: Verify package exists
      shell: pwsh
      env:
        PACKAGE_FILE: ${{ matrix.file }}
      run: |
        $file = Get-Item (Join-Path "desktop/dist" $env:PACKAGE_FILE)
        if ($file.Length -lt 1MB) { throw "Windows package is unexpectedly small." }
    - name: Upload ${{ matrix.label }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: desktop/dist/${{ matrix.file }}
        retention-days: 30
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: portable
          label: portable EXE
          artifact: GEN_Z_VID-Windows-exe
          file: GEN_Z_VID-Windows-x64.exe
        - target: nsis
          label: Setup EXE
          artifact: GEN_Z_VID-Windows-setup
          file: GEN_Z_VID-Setup-x64.exe
        - target: msi
          label: MSI installer
          artifact: GEN_Z_VID-Windows-msi
          file: GEN_Z_VID-Installer-x64.msi
  save-downloads:
    name: Save packages in GitHub Releases
    needs:
    - release
    - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download this build's packages
      uses: actions/download-artifact@v4
      with:
        path: packages
        merge-multiple: true
    - name: Publish versioned download archive
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: packages-${{ github.run_number }}
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/package-release-notes.txt"
        cat > "$notes" <<'TXT'
        GEN Z VID v1.0.1 packages with browser-based Google login.
        Only packages successfully built in this run are included; check Actions for any failed format.
        Android: signed AAB for Google Play and signed APK for direct installation.
        Windows: portable EXE, Setup EXE, and MSI installer (unsigned).
        Android uses the browser-tab login flow tested by the owner. Windows opens the system browser to keep Google login in one browser session.
        Microsoft Store MSIX/AppX packages are not included until the app's Partner Center identity is configured.
        These packages require internet access to load https://gen-z-vid.firebaseapp.com.
        TXT
        mapfile -d '' files < <(find packages -type f -print0)
        test "${#files[@]}" -gt 0
        gh release create "$RELEASE_TAG" "${files[@]}" \
          --target "$GITHUB_SHA" \
          --title "GEN Z VID packages - build ${{ github.run_number }}" \
          --notes-file "$notes"
    if: ${{ always() && !cancelled() }}
