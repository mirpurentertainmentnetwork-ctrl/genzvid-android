name: Build Android and Windows apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check signing password
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#KEYSTORE_PASSWORD}" -lt 16 ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_PASSWORD (at least 16 characters) and ANDROID_KEYSTORE_BASE64 as repository Actions secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          # Use a finite input file so pipefail cannot turn yes/SIGPIPE into a failure.
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers.txt"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses \
            < "$RUNNER_TEMP/android-license-answers.txt" > "$RUNNER_TEMP/android-licenses.log" 2>&1 || {
              tail -n 40 "$RUNNER_TEMP/android-licenses.log"
              exit 1
            }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Install Android SDK and Cordova
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          npm install --global cordova@13.0.0

      - name: Create Firebase WebView project
        shell: bash
        run: |
          set -euo pipefail
          cordova create genzvid com.pmbsiam.genzvid "GEN Z VID"
          cd genzvid
          cat > config.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget id="com.pmbsiam.genzvid" version="1.0.1"
              xmlns="http://www.w3.org/ns/widgets"
              xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>GEN Z VID</name>
              <description>Social media platform maker by PMB SIAM</description>
              <author email="developer@pmbsiam.com" href="https://gen-z-vid.firebaseapp.com">PMB SIAM</author>
              <content src="https://gen-z-vid.firebaseapp.com" />
              <access origin="*" />
              <allow-navigation href="https://gen-z-vid.firebaseapp.com/*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="LogLevel" value="ERROR" />
              <preference name="android-versionCode" value="100000000" />
          </widget>
          XML
          node <<'VERSION'
          const fs = require('fs');
          const code = String(100000000 + Number(process.env.GITHUB_RUN_NUMBER));
          const xml = fs.readFileSync('config.xml', 'utf8').replace('value="100000000"', 'value="' + code + '"');
          fs.writeFileSync('config.xml', xml);
          VERSION
          cordova platform add android@15.1.0

      - name: Restore release keystore from Secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/genzvid-release.keystore
          keytool -list -keystore signing/genzvid-release.keystore \
            -storepass:env KEYSTORE_PASSWORD -alias genzvid_alias > /dev/null

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const password = process.env.KEYSTORE_PASSWORD;
          fs.writeFileSync('genzvid/build.json', JSON.stringify({
            android: { release: {
              keystore: path.resolve('signing/genzvid-release.keystore'),
              storePassword: password,
              alias: 'genzvid_alias',
              password: password,
              keystoreType: 'jks'
            }}
          }), { mode: 0o600 });
          JS

      - name: Use browser session for website and Google login
        shell: bash
        run: |
          set -euo pipefail
          cat > genzvid/platforms/android/app/src/main/java/com/pmbsiam/genzvid/MainActivity.java <<'JAVA'
          package com.pmbsiam.genzvid;
          
          import org.apache.cordova.CordovaActivity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          
          public class MainActivity extends CordovaActivity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 64, 32, 32);
                  TextView title = new TextView(this);
                  title.setText("GEN Z VID");
                  title.setTextSize(28);
                  layout.addView(title);
                  TextView info = new TextView(this);
                  info.setText("Opening GEN Z VID…");
                  layout.addView(info);
                  Button open = new Button(this);
                  open.setText("Open GEN Z VID");
                  open.setOnClickListener(v -> openSite());
                  open.setVisibility(android.view.View.GONE);
                  layout.addView(open);
                  setContentView(layout);
                  openSite();
              }
              private void openSite() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://gen-z-vid.firebaseapp.com"));
                      // Custom Tabs protocol: a null session lets compatible browsers open a browser tab.
                      Bundle extras = new Bundle();
                      extras.putBinder("android.support.customtabs.extra.SESSION", null);
                      intent.putExtras(extras);
                      intent.putExtra("android.support.customtabs.extra.TITLE_VISIBILITY", 0);
                      intent.putExtra("android.support.customtabs.extra.ENABLE_URLBAR_HIDING", true);
                      startActivity(intent);
                  } catch (android.content.ActivityNotFoundException e) {
                      Toast.makeText(this, "Install or enable a web browser to open GEN Z VID.", Toast.LENGTH_LONG).show();
                  }
              }
          }
          JAVA

      - name: Build signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          cd genzvid
          cordova build android --release --buildConfig=build.json -- --packageType=bundle
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../GEN_Z_VID.aab

      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify GEN_Z_VID.aab > signature-check.txt
          grep -q "jar verified" signature-check.txt

      - name: Upload signed Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-signed-aab
          path: GEN_Z_VID.aab
          retention-days: 30
          if-no-files-found: error


      - name: Build signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd genzvid
          cordova build android --release --buildConfig=build.json -- --packageType=apk
          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../GEN_Z_VID.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../GEN_Z_VID.apk

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-signed-apk
          path: GEN_Z_VID.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing credentials
        if: always()
        run: rm -f genzvid/build.json signing/genzvid-release.keystore signing/ANDROID_KEYSTORE_BASE64.txt

  windows:
    name: Windows EXE and MSI installers
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Windows app source
        shell: bash
        run: |
          set -euo pipefail
          mkdir desktop
          cd desktop
          cat > package.json <<'JSON'
          {
            "name": "genzvid-desktop",
            "version": "1.0.0",
            "description": "GEN Z VID desktop app",
            "author": "PMB SIAM",
            "main": "main.js",
            "private": true,
            "devDependencies": {
              "electron": "44.7.2",
              "electron-builder": "26.15.3"
            },
            "build": {
              "appId": "com.pmbsiam.genzvid.desktop",
              "productName": "GEN Z VID",
              "files": [
                "main.js",
                "package.json"
              ],
              "asar": true,
              "win": {
                "target": [
                  {
                    "target": "portable",
                    "arch": [
                      "x64"
                    ]
                  },
                  {
                    "target": "nsis",
                    "arch": [
                      "x64"
                    ]
                  },
                  {
                    "target": "msi",
                    "arch": [
                      "x64"
                    ]
                  }
                ],
                "signAndEditExecutable": false
              },
              "artifactName": "GEN_Z_VID-Windows-${arch}.${ext}",
              "nsis": {
                "artifactName": "GEN_Z_VID-Setup-${arch}.${ext}",
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              },
              "msi": {
                "artifactName": "GEN_Z_VID-Installer-${arch}.${ext}"
              }
            }
          }
          JSON
          cat > main.js <<'JS'
          const { app, BrowserWindow, shell, dialog } = require('electron');
          const HOME = 'https://gen-z-vid.firebaseapp.com';
          let mainWindow;
          function openSite() {
            shell.openExternal(HOME).catch(() => {
              dialog.showErrorBox('GEN Z VID', 'Could not open your browser. Enable a default web browser and try again.');
            });
          }
          app.whenReady().then(() => {
            mainWindow = new BrowserWindow({
              width: 520, height: 330, title: 'GEN Z VID', autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true, sandbox: true }
            });
            mainWindow.webContents.on('will-navigate', (event, url) => {
              event.preventDefault();
              if (url === HOME || url === HOME + '/') openSite();
            });
            mainWindow.webContents.setWindowOpenHandler(() => ({ action: 'deny' }));
            const html = '<!doctype html><html><head><meta charset="utf-8"><title>GEN Z VID</title></head><body style="font-family:Segoe UI,sans-serif;padding:32px;background:#101827;color:white"><h1>GEN Z VID</h1><p>Your browser opens the app and keeps your Google login session.</p><a style="display:inline-block;padding:12px 20px;background:#ffce64;color:#141414;border-radius:8px;text-decoration:none" href="' + HOME + '">Open GEN Z VID</a></body></html>';
            mainWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(html));
            openSite();
          });
          app.on('window-all-closed', () => app.quit());
          JS
          node --check main.js

      - name: Build Windows portable EXE and installers
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never

      - name: Verify Windows executable exists
        shell: pwsh
        run: |
          $file = Get-Item desktop/dist/GEN_Z_VID-Windows-x64.exe
          if ($file.Length -lt 1MB) { throw "Windows executable is unexpectedly small." }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Windows executable header." }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-Windows-exe
          path: desktop/dist/GEN_Z_VID-Windows-x64.exe
          retention-days: 30
          if-no-files-found: error

      - name: Build Windows installers
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npx electron-builder --win nsis msi --x64 --publish never

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-Windows-installers
          path: |
            desktop/dist/GEN_Z_VID-Setup-x64.exe
            desktop/dist/GEN_Z_VID-Installer-x64.msi
          retention-days: 30
          if-no-files-found: error

  save-downloads:
    name: Save packages in GitHub Releases
    needs: [release, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this build's packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish versioned download archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: packages-${{ github.run_number }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/package-release-notes.txt"
          cat > "$notes" <<'TXT'
          GEN Z VID v1.0.1 packages with browser-based Google login.
          Android: signed AAB for Google Play and signed APK for direct installation.
          Windows: portable EXE, Setup EXE, and MSI installer (unsigned).
          Android uses the browser-tab login flow tested by the owner. Windows opens the system browser to keep Google login in one browser session.
          Microsoft Store MSIX/AppX packages are not included until the app's Partner Center identity is configured.
          These packages require internet access to load https://gen-z-vid.firebaseapp.com.
          TXT
          mapfile -d '' files < <(find packages -type f -print0)
          test "${#files[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "GEN Z VID packages - build ${{ github.run_number }}" \
            --notes-file "$notes"
