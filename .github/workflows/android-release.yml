name: Build Android and Windows apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check signing password
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#KEYSTORE_PASSWORD}" -lt 16 ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_PASSWORD (at least 16 characters) and ANDROID_KEYSTORE_BASE64 as repository Actions secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          # Use a finite input file so pipefail cannot turn yes/SIGPIPE into a failure.
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers.txt"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses \
            < "$RUNNER_TEMP/android-license-answers.txt" > "$RUNNER_TEMP/android-licenses.log" 2>&1 || {
              tail -n 40 "$RUNNER_TEMP/android-licenses.log"
              exit 1
            }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Install Android SDK and Cordova
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          npm install --global cordova@13.0.0

      - name: Create Firebase WebView project
        shell: bash
        run: |
          set -euo pipefail
          cordova create genzvid com.pmbsiam.genzvid "GEN Z VID"
          cd genzvid
          cat > config.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget id="com.pmbsiam.genzvid" version="1.0.0"
              xmlns="http://www.w3.org/ns/widgets"
              xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>GEN Z VID</name>
              <description>Social media platform maker by PMB SIAM</description>
              <author email="developer@pmbsiam.com" href="https://gen-z-vid.web.app">PMB SIAM</author>
              <content src="https://gen-z-vid.web.app" />
              <access origin="*" />
              <allow-navigation href="https://gen-z-vid.web.app/*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="LogLevel" value="ERROR" />
              <preference name="android-versionCode" value="${{ github.run_number }}" />
          </widget>
          XML
          cordova platform add android@15.1.0

      - name: Restore release keystore from Secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/genzvid-release.keystore
          keytool -list -keystore signing/genzvid-release.keystore \
            -storepass:env KEYSTORE_PASSWORD -alias genzvid_alias > /dev/null

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const password = process.env.KEYSTORE_PASSWORD;
          fs.writeFileSync('genzvid/build.json', JSON.stringify({
            android: { release: {
              keystore: path.resolve('signing/genzvid-release.keystore'),
              storePassword: password,
              alias: 'genzvid_alias',
              password: password,
              keystoreType: 'jks'
            }}
          }), { mode: 0o600 });
          JS

      - name: Build signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          cd genzvid
          cordova build android --release --buildConfig=build.json -- --packageType=bundle
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab ../GEN_Z_VID.aab

      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify GEN_Z_VID.aab > signature-check.txt
          grep -q "jar verified" signature-check.txt

      - name: Upload signed Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-signed-aab
          path: GEN_Z_VID.aab
          retention-days: 30
          if-no-files-found: error


      - name: Build signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd genzvid
          cordova build android --release --buildConfig=build.json -- --packageType=apk
          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../GEN_Z_VID.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify ../GEN_Z_VID.apk

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-signed-apk
          path: GEN_Z_VID.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing credentials
        if: always()
        run: rm -f genzvid/build.json signing/genzvid-release.keystore signing/ANDROID_KEYSTORE_BASE64.txt

  windows:
    name: Windows EXE and MSI installers
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Windows app source
        shell: bash
        run: |
          set -euo pipefail
          mkdir desktop
          cd desktop
          cat > package.json <<'JSON'
          {
            "name": "genzvid-desktop",
            "version": "1.0.0",
            "description": "GEN Z VID desktop app",
            "author": "PMB SIAM",
            "main": "main.js",
            "private": true,
            "devDependencies": {
              "electron": "44.7.2",
              "electron-builder": "26.15.3"
            },
            "build": {
              "appId": "com.pmbsiam.genzvid.desktop",
              "productName": "GEN Z VID",
              "files": [
                "main.js",
                "package.json"
              ],
              "asar": true,
              "win": {
                "target": [
                  {
                    "target": "portable",
                    "arch": [
                      "x64"
                    ]
                  },
                  {
                    "target": "nsis",
                    "arch": [
                      "x64"
                    ]
                  },
                  {
                    "target": "msi",
                    "arch": [
                      "x64"
                    ]
                  }
                ],
                "signAndEditExecutable": false
              },
              "artifactName": "GEN_Z_VID-Windows-${arch}.${ext}",
              "nsis": {
                "artifactName": "GEN_Z_VID-Setup-${arch}.${ext}",
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              },
              "msi": {
                "artifactName": "GEN_Z_VID-Installer-${arch}.${ext}"
              }
            }
          }
          JSON
          cat > main.js <<'JS'
          const { app, BrowserWindow, shell, dialog } = require('electron');
          const HOME = 'https://gen-z-vid.web.app';
          let mainWindow;
          function trusted(url) {
            try { return new URL(url).origin === HOME; } catch { return false; }
          }
          function external(url) {
            try {
              if (new URL(url).protocol === 'https:') shell.openExternal(url).catch(() => {});
            } catch {}
          }
          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1200, height: 800, minWidth: 360, minHeight: 540,
              title: 'GEN Z VID', autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true, sandbox: true, webSecurity: true }
            });
            mainWindow.webContents.on('will-navigate', (event, url) => {
              if (!trusted(url)) { event.preventDefault(); external(url); }
            });
            mainWindow.webContents.setWindowOpenHandler(({ url }) => {
              external(url);
              return { action: 'deny' };
            });
            mainWindow.loadURL(HOME).catch(() => {
              dialog.showErrorBox('GEN Z VID', 'Could not open the website. Check your internet connection, then restart the app.');
            });
            mainWindow.on('closed', () => { mainWindow = null; });
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          JS
          node --check main.js

      - name: Build Windows portable EXE and installers
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx electron-builder --win portable nsis msi --x64 --publish never

      - name: Verify Windows executable exists
        shell: pwsh
        run: |
          $file = Get-Item desktop/dist/GEN_Z_VID-Windows-x64.exe
          if ($file.Length -lt 1MB) { throw "Windows executable is unexpectedly small." }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Windows executable header." }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-Windows-exe
          path: desktop/dist/GEN_Z_VID-Windows-x64.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: GEN_Z_VID-Windows-installers
          path: |
            desktop/dist/GEN_Z_VID-Setup-x64.exe
            desktop/dist/GEN_Z_VID-Installer-x64.msi
          retention-days: 30
          if-no-files-found: error
